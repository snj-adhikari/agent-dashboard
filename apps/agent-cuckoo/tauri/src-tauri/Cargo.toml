[package]
name = "agent-cuckoo"
version = "0.0.0"
description = "agent-cuckoo island for agent-monitor"
authors = ["Snj - nightwalker"]
edition = "2021"

[lib]
name = "agent_cuckoo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agent-cuckoo"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-opener = "2"
