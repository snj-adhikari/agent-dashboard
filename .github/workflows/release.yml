name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists"; exit 0; fi
          subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")"
          git for-each-ref --format='%(contents:body)' "refs/tags/$TAG" > notes.md
          gh release create "$TAG" --title "$subject" --notes-file notes.md --verify-tag
